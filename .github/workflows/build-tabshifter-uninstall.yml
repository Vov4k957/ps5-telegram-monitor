name: Build TabShifter uninstall ELF (isolated)
run-name: TabShifter PR21 / PS5 13.60 / ${{ github.sha }}

on:
  push:
    branches:
      - build/tabshifter-uninstall-20261101
    paths:
      - '.github/workflows/build-tabshifter-uninstall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exactly the TabShifter uninstaller PR source
        uses: actions/checkout@v4
        with:
          repository: rdmrocha/PS5-TabShifter
          ref: 73ef3bc6ac1ccdcdef683f84a498aa15af9bca1c
          persist-credentials: false
      - name: Install SDK and SQLite sources
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget unzip make
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          wget -q https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip -O /tmp/sqlite.zip
          unzip -q -j /tmp/sqlite.zip '*/sqlite3.c' '*/sqlite3.h'
      - name: Compile TabShifter.elf with Uninstall button
        run: |
          set -euxo pipefail
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          /opt/ps5-payload-sdk/bin/prospero-clang -O2 -I. \
            -DSQLITE_THREADSAFE=0 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -DSQLITE_OMIT_WAL=1 \
            -DSQLITE_ENABLE_JSON1=1 \
            main.c sqlite3.c \
            -lkernel_sys -lSceIpmi -lSceAppInstUtil \
            -o TabShifter.elf
          file TabShifter.elf
          sha256sum TabShifter.elf
          test -s TabShifter.elf
      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabShifter-PR21-uninstall-PS5-13.60
          path: TabShifter.elf
          retention-days: 30
          if-no-files-found: error
