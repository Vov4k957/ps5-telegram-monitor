name: Cloudflare D1 sync connection check
on:
  push:
    paths:
      - '.github/workflows/cloudflare-sync-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout validation code
        uses: actions/checkout@v4
      - name: Verify Cloudflare sync secret and subscriptions
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from check_releases import validate_cloudflare_sync_payload
          secret = os.environ.get("SYNC_SECRET", "")
          if not secret:
              raise SystemExit("SYNC_SECRET is not configured in GitHub Actions Secrets")
          url = "https://ps5-telegram-webhook.vov4k95777.workers.dev/sync"
          request = urllib.request.Request(
              url, headers={"Authorization": f"Bearer {secret}", "Accept": "application/json", "User-Agent": "ps5-github-telegram-notifier/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              print("Sync HTTP status:", error.code)
              print("Server:", error.headers.get("server", "unknown"))
              print("Content type:", error.headers.get("content-type", "unknown"))
              print("CF mitigation:", error.headers.get("cf-mitigated", "none"))
              # Only emit the beginning of the diagnostic HTML or JSON, never credentials.
              body = error.read(450).decode("utf-8", "replace")
              print("Response preview:", body[:200].replace("\\n", " "))
              raise SystemExit("Cloudflare sync request denied; no secret disclosed")
          except Exception as error:
              raise SystemExit("Cloudflare sync request failed: " + type(error).__name__)
          try:
              repos, translated = validate_cloudflare_sync_payload(payload)
          except RuntimeError as error:
              raise SystemExit(str(error)) from None
          print("Cloudflare D1 sync verified; subscriptions:", len(repos),
                "translation enabled:", translated, "; authorization successful")
          PY

