name: PS5 releases to Telegram
run-name: PS5 monitor / ${{ github.event_name }} / #${{ github.run_number }}

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps5-telegram.yml'
      - 'check_releases.py'
      - 'test_check_releases.py'

permissions:
  contents: write

concurrency:
  group: ps5-telegram-monitor
  cancel-in-progress: false

jobs:
  check-releases:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A queued run must use the newest saved Telegram offset and release IDs.
          ref: main
          fetch-depth: 0

      - name: Test commands, buttons, history and failure recovery
        run: python3 -m unittest -q test_check_releases.py

      - name: Check PS5 GitHub releases and notify Telegram
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          MONITOR_REPORT_ENABLED: 'true'
          # Opt in only after SYNC_SECRET is configured and the Telegram webhook is ready.
          CLOUDFLARE_SYNC_ENABLED: 'true'
          CLOUDFLARE_SYNC_URL: https://ps5-telegram-webhook.vov4k95777.workers.dev/sync
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: timeout 420s python3 -u check_releases.py

      - name: Save the observed versions between runs
        id: persist
        if: ${{ always() && steps.monitor.outcome != 'skipped' }}
        run: |
          if [ ! -f release_state.json ]; then
            echo 'State file is missing'
            exit 1
          fi
          python3 -m json.tool release_state.json > /dev/null
          cp release_state.json "$RUNNER_TEMP/ps5-release-state.json"
          git add release_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remember PS5 releases [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            # Preserve a concurrent code change; a state conflict fails visibly.
            git pull --rebase origin main || exit 1
          done
          exit 1

      - name: Keep recovery checkpoint if Git push failed
        if: ${{ always() && steps.persist.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ps5-state-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/ps5-release-state.json
          retention-days: 7
          if-no-files-found: warn

