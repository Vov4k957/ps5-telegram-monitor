
name: PS5 releases to Telegram

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps5-telegram-monitor
  cancel-in-progress: false

jobs:
  check-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PS5 GitHub releases and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 check_releases.py

      - name: Save the observed versions between runs
        run: |
          if [ ! -f release_state.json ]; then
            echo 'State file is missing'
            exit 1
          fi
          git add release_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remember PS5 releases [skip ci]'
          git push
